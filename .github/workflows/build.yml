name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Native mocked tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly ./...
      - name: Formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cmd internal tools)"
      - name: Race tests (native Unix only)
        if: runner.os != 'Windows'
        run: go test -race -mod=readonly ./...
        env:
          CGO_ENABLED: '1'
  cross:
    name: Compile ${{ matrix.os }}/${{ matrix.arch }} (not runtime tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: freebsd, arch: amd64 }
          - { os: linux, arch: amd64 }
          - { os: windows, arch: amd64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go build -mod=readonly -trimpath -o frontend ./cmd/makemkv-tui
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
