name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a non-publishing preview of the selected source ref
        type: string
        required: true
        default: v0.2.0
permissions:
  contents: read
concurrency:
  group: makemkv-release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  resolve:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      epoch: ${{ steps.source.outputs.epoch }}
      preview: ${{ steps.source.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and resolve source exactly once
        id: source
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: python3 tools/release/ci.py --version "$VERSION"
  checks:
    needs: resolve
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
    permissions:
      contents: read
  package-checks:
    needs: resolve
    uses: ./.github/workflows/packaging.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
    permissions:
      contents: read
  build:
    needs: [resolve, checks, package-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [freebsd/amd64, linux/amd64, windows/amd64, darwin/amd64, darwin/arm64]
        include:
          - target: freebsd/amd64
            artifact: freebsd-amd64
          - target: linux/amd64
            artifact: linux-amd64
          - target: windows/amd64
            artifact: windows-amd64
          - target: darwin/amd64
            artifact: darwin-amd64
          - target: darwin/arm64
            artifact: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: Build, embed identity, validate binary and package in fresh job directory
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.epoch }}
          PREVIEW: ${{ needs.resolve.outputs.preview }}
          TARGET: ${{ matrix.target }}
        run: |
          go run ./tools/release --version "$VERSION" --commit "$COMMIT" --preview="$PREVIEW" \
            --target "$TARGET" --out "$RUNNER_TEMP/makemkv-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.resolve.outputs.commit }}-${{ matrix.artifact }}
          path: ${{ runner.temp }}/makemkv-release/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true # Only ephemeral workflow artifacts; never public Release assets.
          retention-days: 7
  validate:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          pattern: release-${{ needs.resolve.outputs.commit }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/makemkv-complete
      - name: Require all five artifacts, verify same tag/commit/toolchain and generate final checksums
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          PREVIEW: ${{ needs.resolve.outputs.preview }}
        run: |
          go run ./tools/release --checksums --version "$VERSION" --commit "$COMMIT" --preview="$PREVIEW" --out "$RUNNER_TEMP/makemkv-complete"
          go run ./tools/release --verify --version "$VERSION" --commit "$COMMIT" --preview="$PREVIEW" --out "$RUNNER_TEMP/makemkv-complete"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-${{ needs.resolve.outputs.commit }}
          path: ${{ runner.temp }}/makemkv-complete/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
  publish:
    needs: [resolve, checks, package-checks, build, validate]
    if: github.event_name == 'push' && github.repository == 'madarlevi/makemkv-tui' && needs.resolve.outputs.preview == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-${{ needs.resolve.outputs.commit }}
          path: ${{ runner.temp }}/makemkv-publish
      - name: Revalidate exact downloaded bytes before making any API writes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: go run ./tools/release --verify --version "$VERSION" --commit "$COMMIT" --out "$RUNNER_TEMP/makemkv-publish"
      - name: Resume owned draft safely, verify uploaded bytes, publish once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: python3 tools/release/release.py --publish --tag "$VERSION" --commit "$COMMIT" --dir "$RUNNER_TEMP/makemkv-publish"
