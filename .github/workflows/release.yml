name: Prepare draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag (choose the tag for manual runs)
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          [[ "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo 'Select a version tag such as v0.1.0; branch releases are refused.' >&2
            exit 1
          }
  checks:
    needs: validate
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
  package:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [freebsd/amd64, linux/amd64, windows/amd64, darwin/amd64, darwin/arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Reproducible archive
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          go run ./tools/release --version "$RELEASE_TAG" --target "$RELEASE_TARGET" --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-${{ strategy.job-index }}
          path: dist/makemkv-tui-*
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - run: go run ./tools/release --checksums --out dist
      - name: Create draft only; public publication requires owner review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --draft --verify-tag \
            --title "makemkv-tui $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
